<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="vanesevBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="50%" stop-color="#14171E"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="vanesevGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="25%" stop-color="#E5C158"/>
      <stop offset="60%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A7732"/>
    </linearGradient>
    <linearGradient id="vanesevAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#C5A059" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Luxury Squircle Outer Base -->
  <rect width="512" height="512" rx="128" fill="url(#vanesevBg)"/>
  
  <!-- Outer Gold Micro-Border -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#vanesevGold)" stroke-width="3" opacity="0.4"/>
  
  <!-- Subtle Concentric Geometry -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#vanesevGold)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="url(#vanesevGold)" stroke-width="1" stroke-dasharray="4 6" opacity="0.25"/>

  <!-- Top Star Sparkle -->
  <path d="M 256 68 L 261 82 L 275 86 L 261 90 L 256 104 L 251 90 L 237 86 L 251 82 Z" fill="url(#vanesevGold)"/>

  <!-- Iconic Monogram "V" in Luxury Serif Geometry -->
  <g filter="url(#goldGlow)">
    <path d="M 148 152 L 198 152 L 256 348 L 314 152 L 364 152 L 284 396 C 278 414 266 422 256 422 C 246 422 234 414 228 396 Z" fill="url(#vanesevGold)"/>
  </g>

  <!-- Micro-Diamond Accents -->
  <polygon points="256,448 261,454 256,460 251,454" fill="url(#vanesevGold)"/>
</svg>